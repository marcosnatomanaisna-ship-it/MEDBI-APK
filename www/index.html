<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cores — Referência Hexadecimal CSS/W3C</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg: #fbfbfa;
    --panel: #ffffff;
    --line: #e6e6e3;
    --line-strong: #d4d4d0;
    --ink: #1c1c1a;
    --ink-dim: #6b6b66;
    --ink-faint: #a3a39d;
    --focus: #1c1c1a;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
  }
  code, .mono{ font-family: 'IBM Plex Mono', monospace; }
  ::selection{ background: var(--ink); color: var(--bg); }

  a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  /* ---------- HEADER ---------- */
  header{
    max-width: 1120px;
    margin: 0 auto;
    padding: 44px 28px 22px;
  }
  .label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 10px;
  }
  h1{
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
  }

  /* ---------- SPECTRUM RAIL ---------- */
  .spectrum-rail{
    display:flex;
    width:100%;
    height: 26px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .spectrum-rail .seg{
    flex: 1 1 0;
    min-width: 1px;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .spectrum-rail .seg:hover{
    transform: scaleY(1.2);
    box-shadow: 0 0 0 1px rgba(0,0,0,.18) inset;
    position: relative;
    z-index: 2;
  }
  @media (max-width: 640px){
    .spectrum-rail{ height: 18px; }
  }

  /* ---------- IMAGE MATCH ---------- */
  .match-section{
    max-width: 1120px;
    margin: 0 auto;
    padding: 18px 28px 22px;
    border-bottom: 1px solid var(--line);
  }
  .match-toggle{
    display:flex;
    align-items:center;
    gap: 8px;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
  }
  .match-toggle-icon{ color: var(--ink-faint); flex-shrink: 0; }
  .match-toggle-label{ flex: 1 1 auto; text-align: left; }
  .match-toggle-chevron{ color: var(--ink-faint); flex-shrink: 0; transition: transform .15s ease; }
  .match-toggle[aria-expanded="true"] .match-toggle-chevron{ transform: rotate(90deg); }

  .match-body{
    display: none;
    margin-top: 16px;
    gap: 20px;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .match-body.open{ display: flex; }

  .match-drop{
    flex: 1 1 300px;
    max-width: 420px;
    border: 1px dashed var(--line-strong);
    border-radius: 8px;
    padding: 14px;
    background: var(--panel);
  }
  .match-drop.has-image{ padding: 0; overflow: hidden; }
  .match-drop-empty{
    display:flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 30px 12px;
    text-align: center;
    color: var(--ink-faint);
  }
  .match-drop-empty svg{ color: var(--ink-faint); }
  .match-drop-empty p{ margin: 0; font-size: 12.5px; line-height: 1.5; }

  .file-buttons{
    display:flex;
    gap: 8px;
  }
  .file-btn{
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line-strong);
    border-radius: 5px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .file-btn:hover{ background: var(--line); }

  #matchCanvas{
    display:block;
    width: 100%;
    height: auto;
    cursor: crosshair;
  }

  .match-result{
    flex: 1 1 260px;
    max-width: 340px;
    display: none;
  }
  .match-result.show{ display: block; }
  .match-result-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 10px;
  }
  .match-pair{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .match-swatch{
    width: 40px;
    height: 40px;
    border-radius: 6px;
    border: 1px solid rgba(0,0,0,.08);
    flex-shrink: 0;
  }
  .match-arrow{ color: var(--ink-faint); flex-shrink: 0; }
  .match-info-line{ font-size: 13px; }
  .match-info-line .mono{ color: var(--ink-dim); font-size: 12px; }
  .match-picked-hex{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-faint);
    margin: 2px 0 0;
  }
  .match-distance{
    margin-top: 10px;
    font-size: 11.5px;
    color: var(--ink-faint);
  }

  /* ---------- HEX INPUT MATCH ---------- */
  .hex-input-box{
    flex: 1 1 260px;
    max-width: 300px;
  }
  .hex-input-row{
    display:flex;
    align-items:center;
    gap: 2px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    padding: 8px 12px;
    background: var(--panel);
  }
  .hex-input-row:focus-within{ border-color: var(--ink); }
  .hex-input-hash{
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink-faint);
    font-size: 15px;
  }
  .hex-input{
    border:none; outline:none; background:none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    color: var(--ink);
    width: 100%;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .hex-input::placeholder{ color: var(--ink-faint); text-transform: none; }
  .hex-input-error{
    margin: 8px 2px 0;
    font-size: 11.5px;
    color: #C0392B;
    min-height: 14px;
  }

  @keyframes flash-row{
    0%, 100%{ background: var(--panel); }
    30%{ background: var(--line); }
  }
  .row.flash{ animation: flash-row 1.1s ease; }

  /* ---------- CONTROLS ---------- */
  .controls{
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    transition: box-shadow .15s ease;
  }
  .controls.scrolled{
    box-shadow: 0 4px 14px -6px rgba(0,0,0,.10);
  }
  .controls-inner{
    max-width: 1120px;
    margin: 0 auto;
    padding: 16px 28px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }
  .search-box{
    display:flex;
    align-items:center;
    gap: 7px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    padding: 6px 9px;
    background: var(--panel);
    flex: 0 1 220px;
    max-width: 220px;
  }
  .search-box svg{ color: var(--ink-faint); flex-shrink:0; }
  .search-box input{
    border:none; outline:none; background:none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--ink);
    width: 100%;
  }
  .search-box input::placeholder{ color: var(--ink-faint); }
  .clear-btn{
    background:none; border:none; color:var(--ink-faint);
    cursor:pointer; font-size:15px; padding:0 2px; display:none;
  }
  .clear-btn.show{ display:block; }

  .tabs-bar{
    display:flex;
    align-items:center;
    gap: 12px;
    flex: 1 1 auto;
    min-width: 0;
  }
  .tabs{
    display:flex;
    gap: 4px;
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    color: var(--ink-dim);
    background: none;
    border: none;
    padding: 6px 10px;
    border-radius: 5px;
    cursor: pointer;
  }
  .tab:hover{ background: var(--line); color: var(--ink); }
  .tab.active{ background: var(--ink); color: var(--bg); }
  .tab.active .tab-dot{ box-shadow: 0 0 0 1px rgba(255,255,255,.4); }
  .tab-dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-right: 6px;
    flex-shrink: 0;
  }

  .result-meta{
    margin-left: auto;
    flex-shrink: 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-faint);
    white-space: nowrap;
  }

  /* ---------- TABLE ---------- */
  main{
    max-width: 1120px;
    margin: 0 auto;
    padding: 8px 28px 100px;
  }

  .cat-header{
    display:flex;
    align-items: baseline;
    gap: 8px;
    padding: 22px 0 8px;
    font-size: 11.5px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-family: 'IBM Plex Mono', monospace;
  }
  .cat-header span{ color: var(--ink-faint); }

  .row-head{
    display:grid;
    grid-template-columns: 40px 1fr 1fr 110px 28px;
    gap: 12px;
    padding: 0 12px 6px;
    font-size: 11px;
    color: var(--ink-faint);
    border-bottom: 1px solid var(--line);
  }

  .row{
    display:grid;
    grid-template-columns: 40px 1fr 1fr 110px 28px;
    align-items:center;
    gap: 12px;
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    background: var(--panel);
    box-shadow: inset 3px 0 0 transparent;
    transition: box-shadow .12s ease, background-color .12s ease;
  }
  .row:hover{ background: var(--line); box-shadow: inset 3px 0 0 var(--row-color); }
  .row:hover .copy-icon{ opacity: 1; }

  .swatch{
    width: 22px;
    height: 22px;
    border-radius: 5px;
    border: 1px solid rgba(0,0,0,.08);
    flex-shrink: 0;
  }
  .name-pt{ font-weight: 500; color: var(--ink); }
  .name-css{ color: var(--ink-dim); }
  .hex-val{
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink-dim);
    font-size: 12.5px;
  }
  .copy-icon{
    opacity: 0;
    color: var(--ink-faint);
    transition: opacity .1s ease;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .copy-icon.done{ opacity: 1; color: var(--ink); }

  .empty{
    display:none;
    text-align:center;
    padding: 70px 20px;
    color: var(--ink-faint);
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .empty.show{ display:block; }

  footer{
    max-width: 1120px;
    margin: 0 auto;
    padding: 20px 28px 60px;
    color: var(--ink-faint);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: .04em;
    text-transform: uppercase;
    border-top: 1px solid var(--line);
  }

  @media (max-width: 640px){
    .row, .row-head{ grid-template-columns: 32px 1fr 78px 20px; }
    .name-css{ display:none; }
    .row-head span:nth-child(3){ display:none; }

    .controls-inner{ flex-wrap: nowrap; flex-direction: row; align-items: center; gap: 10px; }
    .search-box{ max-width: 150px; flex-shrink: 0; }
    .tabs-bar{ flex: 1 1 auto; min-width: 0; }
  }
</style>
</head>
<body>

<header>
  <p class="label">Referência de cores · CSS / W3C</p>
  <h1>Catálogo hexadecimal</h1>
</header>

<div class="spectrum-rail" id="spectrumRail" aria-hidden="true"></div>

<div class="match-section">
  <button class="match-toggle" id="matchToggle" aria-expanded="false">
    <svg class="match-toggle-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    <span class="match-toggle-label">Combinar cor de uma imagem</span>
    <svg class="match-toggle-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
  </button>

  <div class="match-body" id="matchBody">
    <div class="match-drop" id="matchDrop">
      <div class="match-drop-empty" id="matchDropEmpty">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <p>Arraste uma imagem</p>
        <div class="file-buttons">
          <button class="file-btn" id="uploadBtn">Escolher arquivo</button>
          <button class="file-btn" id="captureBtn">Usar câmera</button>
        </div>
      </div>
      <canvas id="matchCanvas" hidden></canvas>
    </div>

    <div class="match-result" id="matchResult">
      <p class="match-result-label">Cor mais próxima</p>
      <div class="match-pair">
        <div class="match-swatch" id="pickedSwatch"></div>
        <svg class="match-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <div class="match-swatch" id="matchedSwatch"></div>
      </div>
      <p class="match-picked-hex mono" id="pickedHex"></p>
      <p class="match-info-line"><span id="matchedName"></span> <span class="mono" id="matchedCss"></span></p>
      <p class="match-distance mono" id="matchDistance"></p>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*" hidden>
  <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
</div>

<div class="match-section">
  <button class="match-toggle" id="hexMatchToggle" aria-expanded="false">
    <svg class="match-toggle-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>
    <span class="match-toggle-label">Buscar cor mais próxima por código hex</span>
    <svg class="match-toggle-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
  </button>

  <div class="match-body" id="hexMatchBody">
    <div class="hex-input-box">
      <p class="match-result-label">Código hex</p>
      <div class="hex-input-row">
        <span class="hex-input-hash">#</span>
        <input type="text" id="hexCodeInput" class="hex-input" placeholder="3A7BD5" maxlength="6" autocomplete="off" spellcheck="false">
      </div>
      <p class="hex-input-error" id="hexInputError"></p>
    </div>

    <div class="match-result" id="hexMatchResult">
      <p class="match-result-label">Cor nomeada mais próxima</p>
      <div class="match-pair">
        <div class="match-swatch" id="hexPickedSwatch"></div>
        <svg class="match-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <div class="match-swatch" id="hexMatchedSwatch"></div>
      </div>
      <p class="match-picked-hex mono" id="hexPickedHexLabel"></p>
      <p class="match-info-line"><span id="hexMatchedName"></span> <span class="mono" id="hexMatchedCss"></span></p>
      <p class="match-distance mono" id="hexMatchDistance"></p>
    </div>
  </div>
</div>

<div class="controls">
  <div class="controls-inner">
    <div class="search-box">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="searchInput" type="text" placeholder="Buscar nome ou hex" autocomplete="off">
      <button class="clear-btn" id="clearBtn" aria-label="Limpar busca">×</button>
    </div>
    <div class="tabs-bar">
      <div class="tabs" id="tabs"></div>
      <div class="result-meta"><span id="resultCount">0</span> / <span id="totalCount">0</span></div>
    </div>
  </div>
</div>

<main id="main"></main>

<div class="empty" id="emptyState">nenhum resultado</div>

<footer>X11 / CSS · W3C</footer>

const main = document.getElementById('main');
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const emptyState = document.getElementById('emptyState');
const resultCount = document.getElementById('resultCount');
const totalCount = document.getElementById('totalCount');
const tabs = document.getElementById('tabs');

function hexToRgb(hex){
  const n = hex.replace('#','');
  return {
    r: parseInt(n.substring(0,2),16),
    g: parseInt(n.substring(2,4),16),
    b: parseInt(n.substring(4,6),16)
  };
}
function rgbToHex({r,g,b}){
  return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('').toUpperCase();
}
function hexToHue(hex){
  const {r,g,b} = hexToRgb(hex);
  const rn=r/255, gn=g/255, bn=b/255;
  const max=Math.max(rn,gn,bn), min=Math.min(rn,gn,bn);
  let h=0;
  if(max!==min){
    const d=max-min;
    switch(max){
      case rn: h=(gn-bn)/d+(gn<bn?6:0); break;
      case gn: h=(bn-rn)/d+2; break;
      case bn: h=(rn-gn)/d+4; break;
    }
    h*=60;
  }
  return h;
}
function categoryColor(cat){
  const items = DATA.filter(d => d.cat === cat);
  const sum = items.reduce((acc,d) => {
    const {r,g,b} = hexToRgb(d.hex);
    acc.r+=r; acc.g+=g; acc.b+=b; return acc;
  }, {r:0,g:0,b:0});
  const n = items.length;
  return `rgb(${Math.round(sum.r/n)}, ${Math.round(sum.g/n)}, ${Math.round(sum.b/n)})`;
}

const categories = [...new Set(DATA.map(d => d.cat))];
let activeCat = 'Todas';

tabs.innerHTML = ['Todas', ...categories].map(c => {
  const dot = c === 'Todas'
    ? `<span class="tab-dot" style="background:conic-gradient(from 0deg,#FF3B30,#FF9500,#FFCC00,#34C759,#00C7C7,#0A84FF,#AF52DE,#FF3B30)"></span>`
    : `<span class="tab-dot" style="background:${categoryColor(c)}"></span>`;
  return `<button class="tab ${c==='Todas'?'active':''}" data-cat="${c}">${dot}${c}</button>`;
}).join('');

tabs.addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if(!btn) return;
  activeCat = btn.dataset.cat;
  [...tabs.children].forEach(b => b.classList.toggle('active', b === btn));
  render();
});

function normalize(str){
  return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function copyIconSVG(){
  return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
}
function checkIconSVG(){
  return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>';
}

function render(){
  const q = normalize(searchInput.value.trim());
  clearBtn.classList.toggle('show', q.length > 0);

  const filtered = DATA.filter(d => {
    const matchesCat = activeCat === 'Todas' || d.cat === activeCat;
    if(!matchesCat) return false;
    if(!q) return true;
    return normalize(d.pt).includes(q) || normalize(d.css).includes(q) || normalize(d.hex).includes(q);
  });

  totalCount.textContent = DATA.length;
  resultCount.textContent = filtered.length;
  emptyState.classList.toggle('show', filtered.length === 0);

  if(filtered.length === 0){ main.innerHTML = ''; return; }

  const groups = {};
  filtered.forEach(d => (groups[d.cat] = groups[d.cat] || []).push(d));

  main.innerHTML = Object.entries(groups).map(([cat, items]) => `
    <div class="cat-header">${cat} <span>(${items.length})</span></div>
    <div class="row-head">
      <span></span><span>Nome</span><span>Padrão CSS</span><span>Hex</span><span></span>
    </div>
    ${items.map(d => `
      <div class="row" data-hex="${d.hex}" style="--row-color:${d.hex}" tabindex="0" title="Copiar ${d.hex}">
        <div class="swatch" style="background:${d.hex}"></div>
        <div class="name-pt">${d.pt}</div>
        <div class="name-css mono">${d.css}</div>
        <div class="hex-val">${d.hex}</div>
        <div class="copy-icon">${copyIconSVG()}</div>
      </div>
    `).join('')}
  `).join('');
}

main.addEventListener('click', e => {
  const row = e.target.closest('.row');
  if(!row) return;
  const hex = row.dataset.hex;
  navigator.clipboard?.writeText(hex).catch(()=>{});
  const icon = row.querySelector('.copy-icon');
  icon.innerHTML = checkIconSVG();
  icon.classList.add('done');
  setTimeout(() => { icon.innerHTML = copyIconSVG(); icon.classList.remove('done'); }, 900);
});

main.addEventListener('keydown', e => {
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const row = e.target.closest('.row');
  if(!row) return;
  e.preventDefault();
  row.click();
});

/* ---------- IMAGE COLOR MATCH ---------- */
const matchToggle = document.getElementById('matchToggle');
const matchBody = document.getElementById('matchBody');
const matchDrop = document.getElementById('matchDrop');
const matchDropEmpty = document.getElementById('matchDropEmpty');
const matchCanvas = document.getElementById('matchCanvas');
const matchResult = document.getElementById('matchResult');
const pickedSwatch = document.getElementById('pickedSwatch');
const matchedSwatch = document.getElementById('matchedSwatch');
const pickedHex = document.getElementById('pickedHex');
const matchedName = document.getElementById('matchedName');
const matchedCss = document.getElementById('matchedCss');
const matchDistance = document.getElementById('matchDistance');
const uploadBtn = document.getElementById('uploadBtn');
const captureBtn = document.getElementById('captureBtn');
const fileInput = document.getElementById('fileInput');
const cameraInput = document.getElementById('cameraInput');

const ctx = matchCanvas.getContext('2d', { willReadFrequently: true });

matchToggle.addEventListener('click', () => {
  const open = matchBody.classList.toggle('open');
  matchToggle.setAttribute('aria-expanded', open);
});

uploadBtn.addEventListener('click', () => fileInput.click());
captureBtn.addEventListener('click', () => cameraInput.click());
fileInput.addEventListener('change', e => loadImageFile(e.target.files[0]));
cameraInput.addEventListener('change', e => loadImageFile(e.target.files[0]));

matchDrop.addEventListener('dragover', e => { e.preventDefault(); matchDrop.style.borderColor = 'var(--ink)'; });
matchDrop.addEventListener('dragleave', () => { matchDrop.style.borderColor = ''; });
matchDrop.addEventListener('drop', e => {
  e.preventDefault();
  matchDrop.style.borderColor = '';
  const file = e.dataTransfer.files && e.dataTransfer.files[0];
  if(file) loadImageFile(file);
});

function loadImageFile(file){
  if(!file || !file.type.startsWith('image/')) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const maxW = 400;
    const scale = Math.min(1, maxW / img.width);
    matchCanvas.width = img.width * scale;
    matchCanvas.height = img.height * scale;
    ctx.drawImage(img, 0, 0, matchCanvas.width, matchCanvas.height);
    URL.revokeObjectURL(url);

    matchDropEmpty.hidden = true;
    matchCanvas.hidden = false;
    matchDrop.classList.add('has-image');
  };
  img.src = url;
}

matchCanvas.addEventListener('click', e => {
  const rect = matchCanvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) * (matchCanvas.width / rect.width));
  const y = Math.floor((e.clientY - rect.top) * (matchCanvas.height / rect.height));
  const pixel = ctx.getImageData(x, y, 1, 1).data;
  const rgb = { r: pixel[0], g: pixel[1], b: pixel[2] };
  showMatch(rgb);
});

// Redmean color distance — closer to human perception than plain Euclidean RGB
function colorDistance(a, b){
  const rMean = (a.r + b.r) / 2;
  const dr = a.r - b.r, dg = a.g - b.g, db = a.b - b.b;
  return Math.sqrt((2 + rMean/256) * dr*dr + 4 * dg*dg + (2 + (255-rMean)/256) * db*db);
}

function nearestColor(rgb){
  let best = null, bestDist = Infinity;
  for(const d of DATA){
    const dist = colorDistance(rgb, hexToRgb(d.hex));
    if(dist < bestDist){ bestDist = dist; best = d; }
  }
  return { match: best, dist: bestDist };
}

function showMatch(rgb){
  const pickedHexVal = rgbToHex(rgb);
  const { match, dist } = nearestColor(rgb);

  pickedSwatch.style.background = pickedHexVal;
  matchedSwatch.style.background = match.hex;
  pickedHex.textContent = pickedHexVal;
  matchedName.textContent = match.pt;
  matchedCss.textContent = match.css;

  const pct = Math.max(0, 100 - (dist / 4.4)).toFixed(0);
  matchDistance.textContent = `${pct}% similar`;

  matchResult.classList.add('show');

  activeCat = 'Todas';
  [...tabs.children].forEach(b => b.classList.toggle('active', b.dataset.cat === 'Todas'));
  searchInput.value = match.hex;
  render();

  requestAnimationFrame(() => {
    const row = main.querySelector(`.row[data-hex="${match.hex}"]`);
    if(row){
      row.classList.add('flash');
      setTimeout(() => row.classList.remove('flash'), 1100);
    }
  });
}

/* ---------- HEX CODE MATCH ---------- */
const hexMatchToggle = document.getElementById('hexMatchToggle');
const hexMatchBody = document.getElementById('hexMatchBody');
const hexCodeInput = document.getElementById('hexCodeInput');
const hexInputError = document.getElementById('hexInputError');
const hexMatchResult = document.getElementById('hexMatchResult');
const hexPickedSwatch = document.getElementById('hexPickedSwatch');
const hexMatchedSwatch = document.getElementById('hexMatchedSwatch');
const hexPickedHexLabel = document.getElementById('hexPickedHexLabel');
const hexMatchedName = document.getElementById('hexMatchedName');
const hexMatchedCss = document.getElementById('hexMatchedCss');
const hexMatchDistance = document.getElementById('hexMatchDistance');

hexMatchToggle.addEventListener('click', () => {
  const open = hexMatchBody.classList.toggle('open');
  hexMatchToggle.setAttribute('aria-expanded', open);
  if(open) hexCodeInput.focus();
});

function isValidHex(str){
  return /^[0-9a-fA-F]{6}$/.test(str) || /^[0-9a-fA-F]{3}$/.test(str);
}
function expandShortHex(str){
  return str.length === 3 ? str.split('').map(c => c + c).join('') : str;
}

hexCodeInput.addEventListener('input', () => {
  const raw = hexCodeInput.value.trim().replace(/^#/, '');

  if(!raw){
    hexInputError.textContent = '';
    hexMatchResult.classList.remove('show');
    return;
  }
  if(!isValidHex(raw)){
    hexInputError.textContent = 'código inválido — use 3 ou 6 dígitos hex (0-9, A-F)';
    hexMatchResult.classList.remove('show');
    return;
  }

  hexInputError.textContent = '';
  const fullHex = '#' + expandShortHex(raw).toUpperCase();
  showHexMatch(hexToRgb(fullHex), fullHex);
});

function showHexMatch(rgb, pickedHexVal){
  const { match, dist } = nearestColor(rgb);

  hexPickedSwatch.style.background = pickedHexVal;
  hexMatchedSwatch.style.background = match.hex;
  hexPickedHexLabel.textContent = pickedHexVal;
  hexMatchedName.textContent = match.pt;
  hexMatchedCss.textContent = match.css;

  const pct = Math.max(0, 100 - (dist / 4.4)).toFixed(0);
  hexMatchDistance.textContent = dist === 0 ? 'correspondência exata' : `${pct}% similar`;

  hexMatchResult.classList.add('show');

  activeCat = 'Todas';
  [...tabs.children].forEach(b => b.classList.toggle('active', b.dataset.cat === 'Todas'));
  searchInput.value = match.hex;
  render();

  requestAnimationFrame(() => {
    const row = main.querySelector(`.row[data-hex="${match.hex}"]`);
    if(row){
      row.classList.add('flash');
      setTimeout(() => row.classList.remove('flash'), 1100);
    }
  });
}
