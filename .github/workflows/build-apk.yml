name: Build APK/AAB

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nome da app'
        required: true
      package_id:
        description: 'Package ID (ex: com.exemplo.app)'
        required: true
      source_mode:
        description: 'file ou url'
        required: true
        default: 'file'
      source_url:
        description: 'URL da app (só usado se source_mode = url)'
        required: false
        default: ''
      output_format:
        description: 'apk ou aab'
        required: true
        default: 'apk'
      splash_color:
        description: 'Cor de fundo do splash screen (hex, ex: #FDE2DD)'
        required: false
        default: '#FDE2DD'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar pasta www/
        run: |
          mkdir -p www
          if [ "${{ github.event.inputs.source_mode }}" = "url" ]; then
            cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"></head><body>A carregar…</body></html>
          EOF
          fi
          # em modo "file", www/index.html já foi commitado pelo backend antes de disparar este workflow.
          # em modo "url" este ficheiro é só um fallback local — quem manda é o
          # server.url do capacitor.config.json, configurado no passo seguinte.

      - name: Injetar polyfill de download/partilha (blob) para Android
        # Só se aplica em modo "file"/"zip" (conteúdo embutido em www/index.html).
        # Em modo "url" a app aponta para um site externo — não há HTML local
        # para injetar nada, por isso este passo é ignorado nesse caso.
        #
        # O que faz: intercepta, ao nível do WebView (sem a app saber),
        # qualquer <a download> com href="blob:..." e qualquer
        # navigator.share({files:...}) — os dois padrões mais comuns que as
        # apps já usam para exportar ficheiros — e reencaminha para a ponte
        # nativa window.AndroidSave.saveBase64(...) registada no
        # MainActivity.java (grava direto na pasta Transferências via
        # MediaStore). Assim, qualquer app gerada por este workflow ganha
        # exportação a funcionar dentro do APK sem precisar de alterar
        # nenhuma linha do próprio código da app.
        run: |
          python3 - <<'PYEOF'
          import re

          path = "www/index.html"
          try:
              with open(path, "r", encoding="utf-8") as f:
                  html = f.read()
          except FileNotFoundError:
              print("www/index.html não encontrado — a saltar injeção.")
          else:
              script = '''<script>
          (function(){
            if(!window.AndroidSave || !window.AndroidSave.saveBase64) return; // só dentro do APK
            function blobToBase64(blob){
              return new Promise((res,rej)=>{
                const r = new FileReader();
                r.onload = () => res(r.result.split(",")[1]);
                r.onerror = rej;
                r.readAsDataURL(blob);
              });
            }
            // Intercepta <a download> apontando para blob:
            document.addEventListener("click", function(ev){
              const a = ev.target.closest && ev.target.closest("a[download]");
              if(!a) return;
              const href = a.getAttribute("href") || "";
              if(!href.startsWith("blob:")) return;
              ev.preventDefault();
              ev.stopImmediatePropagation();
              fetch(href).then(r=>r.blob()).then(async blob=>{
                const b64 = await blobToBase64(blob);
                const filename = a.getAttribute("download") || "ficheiro";
                window.AndroidSave.saveBase64(filename, b64, blob.type || "application/octet-stream");
              });
            }, true);
            // Substitui navigator.share/canShare para ficheiros
            const originalShare = navigator.share ? navigator.share.bind(navigator) : null;
            navigator.canShare = function(data){
              if(data && data.files && data.files.length) return true;
              return false;
            };
            navigator.share = async function(data){
              if(data && data.files && data.files.length){
                const file = data.files[0];
                const b64 = await blobToBase64(file);
                window.AndroidSave.saveBase64(file.name, b64, file.type || "application/octet-stream");
                return;
              }
              if(originalShare) return originalShare(data);
            };
          })();
          </script>
          '''
              if re.search(r"</body>", html, re.IGNORECASE):
                  html = re.sub(r"</body>", script + "</body>", html, count=1, flags=re.IGNORECASE)
              else:
                  html = html + script
              with open(path, "w", encoding="utf-8") as f:
                  f.write(html)
              print("✓ polyfill de download/partilha injetado em www/index.html")
          PYEOF

      - name: Cache de dependências npm (Capacitor)
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: capacitor-deps-${{ runner.os }}-v2

      - name: Instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Inicializar configuração do Capacitor
        # Escrevemos o capacitor.config.json à mão em vez de usar "npx cap init":
        # nas versões atuais do CLI, "cap init" gera capacitor.config.TS (não .json),
        # e o passo seguinte (server.url em modo url) precisa de encontrar o .json.
        # Isto também evita ambiguidade: com os dois ficheiros a existir, o Capacitor
        # prioriza o .ts e as edições feitas ao .json seriam ignoradas.
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          PACKAGE_ID: ${{ github.event.inputs.package_id }}
        run: |
          node -e "
            const fs = require('fs');
            const cfg = {
              appId: process.env.PACKAGE_ID,
              appName: process.env.APP_NAME,
              webDir: 'www'
            };
            fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
            console.log('capacitor.config.json:', JSON.stringify(cfg, null, 2));
          "

      - name: Configurar server.url (modo url — WebView vivo, tipo AppMint)
        if: ${{ github.event.inputs.source_mode == 'url' }}
        env:
          SOURCE_URL: ${{ github.event.inputs.source_url }}
        run: |
          node -e "
            const fs = require('fs');
            const path = 'capacitor.config.json';
            const cfg = JSON.parse(fs.readFileSync(path, 'utf8'));
            const url = process.env.SOURCE_URL;
            cfg.server = cfg.server || {};
            cfg.server.url = url;
            cfg.server.cleartext = url.startsWith('http://');
            fs.writeFileSync(path, JSON.stringify(cfg, null, 2));
            console.log('capacitor.config.json:', JSON.stringify(cfg, null, 2));
          "

      - name: Adicionar plataforma Android
        run: npx cap add android

      - name: Adicionar permissão de armazenamento (Android ≤ 9, exportação legada)
        # A partir do Android 10 (API 29) a gravação via MediaStore não precisa
        # de permissão. Em versões mais antigas, o caminho legado de gravação
        # (AndroidSave.saveLegacy) precisa de WRITE_EXTERNAL_STORAGE.
        # maxSdkVersion="28" evita pedir isto (ou assustar o utilizador) em
        # telemóveis mais recentes, onde nem é usada.
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "WRITE_EXTERNAL_STORAGE" "$MANIFEST"; then
            sed -i 's#<manifest #<manifest #; 0,/<application/s#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <application#' "$MANIFEST"
          fi
          echo "--- AndroidManifest.xml ---"
          cat "$MANIFEST"

      - name: Configurar botão "Voltar" e saída da app
        # Substitui o MainActivity.java gerado pelo "cap add android" (que por
        # omissão só tem "public class MainActivity extends BridgeActivity {}"),
        # por uma versão que trata o botão/gesto "Voltar" do Android:
        # se a WebView tiver histórico (ex: navegou de uma página para outra
        # dentro da app), volta um passo atrás nesse histórico em vez de
        # fechar a app de imediato. Só quando já não há mais histórico
        # (ecrã inicial) é que pergunta "Queres sair da aplicação?" antes
        # de fechar. Sem botão flutuante — nada sobreposto ao conteúdo.
        #
        # Nativo (não JS/CSS injetado na página) — funciona da mesma forma em
        # modo "file"/"zip" (HTML embutido) e em modo "url" (WebView aponta
        # para um site externo, onde não há como controlar o HTML da página).
        env:
          PACKAGE_ID: ${{ github.event.inputs.package_id }}
        run: |
          PKG_PATH=$(echo "$PACKAGE_ID" | tr '.' '/')
          MAIN_ACTIVITY="android/app/src/main/java/$PKG_PATH/MainActivity.java"
          if [ ! -f "$MAIN_ACTIVITY" ]; then
            echo "⚠ não encontrei $MAIN_ACTIVITY pelo caminho esperado — a procurar..."
            MAIN_ACTIVITY=$(find android/app/src/main/java -name MainActivity.java | head -n1)
          fi
          echo "a editar: $MAIN_ACTIVITY"

          cat > "$MAIN_ACTIVITY" <<EOF
          package $PACKAGE_ID;

          import android.app.AlertDialog;
          import android.app.DownloadManager;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Message;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.JavascriptInterface;
          import android.webkit.RenderProcessGoneDetail;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setupExternalLinksAndDownloads();
              }

              // Por omissão, o WebView do Android ignora target="_blank" e
              // window.open() — não há "segunda aba" para onde ir, por isso um
              // botão que faz download/abre link nessas condições fica sem
              // efeito nenhum dentro da app (mas funciona no browser normal).
              // Isto intercepta essas tentativas e reencaminha o URL real para
              // o DownloadManager do Android (ficheiros) ou para o browser do
              // sistema (páginas normais).
              private void setupExternalLinksAndDownloads() {
                  WebView webView = this.bridge.getWebView();
                  if (webView == null) return;

                  WebSettings settings = webView.getSettings();
                  settings.setSupportMultipleWindows(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);

                  // Se o processo do renderer do WebView rebentar (ex: pico de
                  // memória a gerar um ficheiro grande), o Android por omissão
                  // MATA A APP INTEIRA se isto não for tratado — não é um erro
                  // Java, por isso nenhum try/catch apanha isto. Aqui evitamos
                  // esse encerramento: destruímos a WebView crashada e
                  // recriamos o ecrã em vez de deixar o sistema fechar a app.
                  webView.setWebViewClient(new BridgeWebViewClient(this.bridge) {
                      @Override
                      public boolean onRenderProcessGone(WebView view, RenderProcessGoneDetail detail) {
                          Toast.makeText(MainActivity.this, "Ocorreu um problema a processar o pedido — a recarregar…", Toast.LENGTH_LONG).show();
                          if (view != null) {
                              view.destroy();
                          }
                          recreate();
                          return true;
                      }
                  });

                  // Ponte JS -> Android para gravar ficheiros gerados no browser
                  // (blobs .xlsx/.docx/etc). O WebView não trata URLs blob: em
                  // <a download> nem suporta navigator.share({files}) como o
                  // Chrome, por isso funciona no navegador mas não no APK.
                  // A app chama window.AndroidSave.saveBase64(nome, base64, mime)
                  // e o ficheiro é gravado diretamente na pasta Transferências.
                  webView.addJavascriptInterface(new AndroidSave(this), "AndroidSave");

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                          WebView popup = new WebView(MainActivity.this);
                          popup.setWebViewClient(new WebViewClient() {
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest request) {
                                  openExternally(request.getUrl().toString());
                                  return true;
                              }
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView v, String url) {
                                  openExternally(url);
                                  return true;
                              }
                          });
                          WebView.WebViewTransport transport = (WebView.WebViewTransport) resultMsg.obj;
                          transport.setWebView(popup);
                          resultMsg.sendToTarget();
                          return true;
                      }
                  });

                  // Cobre também downloads diretos (ex: <a href="ficheiro.apk"> sem
                  // target="_blank", ou navegação normal para um URL com
                  // Content-Disposition: attachment).
                  webView.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimeType, long contentLength) {
                          openExternally(url);
                      }
                  });
              }

              private void openExternally(String url) {
                  Uri uri = Uri.parse(url);
                  String scheme = uri.getScheme();
                  if (scheme != null && (scheme.equals("http") || scheme.equals("https"))) {
                      try {
                          DownloadManager.Request request = new DownloadManager.Request(uri);
                          request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          String cookies = CookieManager.getInstance().getCookie(url);
                          if (cookies != null) request.addRequestHeader("Cookie", cookies);
                          String fileName = uri.getLastPathSegment();
                          request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName != null ? fileName : "download");
                          DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                          if (dm != null) {
                              dm.enqueue(request);
                              Toast.makeText(this, "A descarregar para a pasta Transferências…", Toast.LENGTH_LONG).show();
                              return;
                          }
                      } catch (Exception e) {
                          // segue para abrir no browser do sistema
                      }
                  }
                  Intent intent = new Intent(Intent.ACTION_VIEW, uri);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  startActivity(intent);
              }

              @Override
              public void onBackPressed() {
                  WebView webView = this.bridge.getWebView();
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      confirmExit();
                  }
              }

              private void confirmExit() {
                  new AlertDialog.Builder(this)
                      .setTitle("Sair da aplicação")
                      .setMessage("Queres sair da aplicação?")
                      .setPositiveButton("Sair", (dialog, which) -> {
                          finishAffinity();
                          System.exit(0);
                      })
                      .setNegativeButton("Cancelar", (dialog, which) -> dialog.dismiss())
                      .setCancelable(true)
                      .show();
              }

              // Ponte para o JS gravar ficheiros (Excel/Word/etc gerados no
              // browser) diretamente na pasta Transferências, já que o
              // WebView não consegue descarregar blob: URLs.
              public class AndroidSave {
                  Context ctx;
                  AndroidSave(Context c){ ctx = c; }

                  @JavascriptInterface
                  public void saveBase64(String filename, String base64Data, String mimeType) {
                      runOnUiThread(() -> {
                          try {
                              byte[] bytes = Base64.decode(base64Data, Base64.DEFAULT);
                              if (Build.VERSION.SDK_INT >= 29) {
                                  saveViaMediaStore(filename, bytes, mimeType);
                              } else {
                                  saveLegacy(filename, bytes);
                              }
                              Toast.makeText(ctx, "Guardado em Transferências: " + filename, Toast.LENGTH_LONG).show();
                          } catch (Throwable t) {
                              // Throwable (não só Exception): em Android < 10, a classe
                              // MediaStore.Downloads não existe e lança um Error, que um
                              // catch(Exception) não apanha — isso fechava a app sem aviso.
                              Toast.makeText(ctx, "Erro ao guardar: " + t.getMessage(), Toast.LENGTH_LONG).show();
                          }
                      });
                  }

                  private void saveViaMediaStore(String filename, byte[] bytes, String mimeType) throws Exception {
                      ContentValues values = new ContentValues();
                      values.put(MediaStore.MediaColumns.DISPLAY_NAME, filename);
                      values.put(MediaStore.MediaColumns.MIME_TYPE, mimeType);
                      values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                      ContentResolver resolver = ctx.getContentResolver();
                      Uri uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                      if (uri == null) throw new Exception("insert() devolveu null");
                      try (OutputStream out = resolver.openOutputStream(uri)) {
                          out.write(bytes);
                      }
                  }

                  private void saveLegacy(String filename, byte[] bytes) throws Exception {
                      // Android 9 (API 28) e anteriores: sem MediaStore.Downloads —
                      // grava direto na pasta pública de Transferências.
                      File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                      if (!dir.exists()) dir.mkdirs();
                      File file = new File(dir, filename);
                      try (FileOutputStream out = new FileOutputStream(file)) {
                          out.write(bytes);
                      }
                  }
              }
          }
          EOF
          echo "--- MainActivity.java final ---"
          cat "$MAIN_ACTIVITY"

      - name: Gerar ícone e splash screen da app
        run: |
          RAW_COLOR="${{ github.event.inputs.splash_color }}"
          if [[ "$RAW_COLOR" =~ ^#[0-9A-Fa-f]{6}$ ]]; then
            SPLASH_COLOR="$RAW_COLOR"
          else
            echo "⚠ cor de splash inválida ou vazia ('$RAW_COLOR') — a usar default #FDE2DD."
            SPLASH_COLOR="#FDE2DD"
          fi
          echo "Cor de fundo do splash: $SPLASH_COLOR"
          echo "SPLASH_COLOR=$SPLASH_COLOR" >> "$GITHUB_ENV"

          if [ -f resources/icon.png ]; then
            echo "Ícone personalizado encontrado — a gerar todos os tamanhos (ícone + splash)..."
            npx @capacitor/assets generate --android \
              --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#000000' \
              --splashBackgroundColor "$SPLASH_COLOR" --splashBackgroundColorDark "$SPLASH_COLOR"
          else
            echo "Sem ícone personalizado — a usar o ícone padrão do Capacitor, mas a aplicar a cor de splash escolhida."
            mkdir -p resources
            # gera um splash mínimo 1x1 na cor escolhida para o @capacitor/assets ter uma fonte a partir da qual trabalhar
            npx @capacitor/assets generate --android \
              --splashBackgroundColor "$SPLASH_COLOR" --splashBackgroundColorDark "$SPLASH_COLOR"
          fi

      - name: Sincronizar
        run: npx cap sync android

      - name: Forçar cor do splash no Android 12+ (API 31)
        # O @capacitor/assets atualiza os recursos "clássicos" (values/colors.xml,
        # drawable), mas a partir do Android 12 o sistema usa a Splash Screen API
        # nativa, que lê a cor de values-v31/styles.xml (windowSplashScreenBackground).
        # Se essa versão do tema não estiver alinhada, o telemóvel ignora a cor
        # escolhida e mostra a cor por defeito. Este passo força-a diretamente.
        run: |
          STYLES="android/app/src/main/res/values/styles.xml"
          echo "--- styles.xml antes da alteração ---"
          cat "$STYLES" || echo "(styles.xml não encontrado em $STYLES)"

          mkdir -p android/app/src/main/res/values-v31
          cat > android/app/src/main/res/values-v31/styles.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">${SPLASH_COLOR}</item>
                  <item name="windowSplashScreenAnimatedIcon">@mipmap/ic_launcher</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
              </style>
          </resources>
          EOF

          echo "--- values-v31/styles.xml gerado ---"
          cat android/app/src/main/res/values-v31/styles.xml

      - name: Corrigir conflito de versões do Kotlin
        run: |
          cat >> android/app/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
              }
          }
          EOF

      - name: Otimizar definições do Gradle (paralelismo + cache de build)
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configureondemand=true
          org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC
          EOF

      - name: Gerar keystore de assinatura
        env:
          # Nunca interpolar ${{ github.event.inputs.* }} diretamente dentro
          # de um bloco "run:" — o GitHub Actions substitui isso por texto
          # ANTES do bash correr, por isso um app_name com aspas/backticks
          # conseguiria injetar comandos no runner (que tem acesso à
          # keystore). Passar por variável de ambiente evita isso: o valor
          # chega ao bash já como uma string normal, nunca como código.
          APP_NAME: ${{ github.event.inputs.app_name }}
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "A usar keystore fixa (secret KEYSTORE_BASE64) — assinatura consistente entre builds."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "STORE_PASS=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "⚠ Sem keystore fixa configurada — a gerar uma nova (apps futuras não vão poder atualizar esta instalação sem desinstalar primeiro)."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias appkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "android123" -keypass "android123" \
              -dname "CN=$APP_NAME, OU=Dev, O=Dev, L=Lisboa, S=Lisboa, C=PT"
            echo "STORE_PASS=android123" >> $GITHUB_ENV
            echo "KEY_ALIAS=appkey" >> $GITHUB_ENV
            echo "KEY_PASS=android123" >> $GITHUB_ENV
          fi

      - name: Build APK/AAB assinado
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "${{ github.event.inputs.output_format }}" = "aab" ]; then
            echo "A gerar AAB (bundleRelease)..."
            ./gradlew bundleRelease --build-cache --parallel \
              -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
              -Pandroid.injected.signing.store.password="$STORE_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
          else
            echo "A gerar APK (assembleRelease)..."
            ./gradlew assembleRelease --build-cache --parallel \
              -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
              -Pandroid.injected.signing.store.password="$STORE_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
          fi

      - name: Renomear ficheiro final para o nome da app
        id: outname
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
        run: |
          SAFE_NAME=$(echo "$APP_NAME" \
            | iconv -f utf8 -t ascii//TRANSLIT 2>/dev/null \
            | sed -E 's/[^a-zA-Z0-9]+/-/g; s/^-+|-+$//g')
          if [ -z "$SAFE_NAME" ]; then SAFE_NAME="app"; fi

          if [ "${{ github.event.inputs.output_format }}" = "aab" ]; then
            SRC="android/app/build/outputs/bundle/release/app-release.aab"
            OUT_NAME="$SAFE_NAME.aab"
          else
            SRC="android/app/build/outputs/apk/release/app-release.apk"
            OUT_NAME="$SAFE_NAME.apk"
          fi
          DEST="$(dirname "$SRC")/$OUT_NAME"
          cp "$SRC" "$DEST"
          echo "out_name=$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "out_path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Publicar Release com o ficheiro gerado
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "${{ github.event.inputs.app_name }} — build #${{ github.run_number }}"
          body: |
            ${{ github.event.inputs.output_format == 'aab' && 'AAB (Android App Bundle)' || 'APK' }} gerado automaticamente.
            Modo: `${{ github.event.inputs.source_mode }}`${{ github.event.inputs.source_mode == 'url' && format(' — WebView aponta para {0} (app vai buscar sempre a versão mais recente, sem precisar de rebuild)', github.event.inputs.source_url) || ' — conteúdo embutido offline no APK' }}
            Package: `${{ github.event.inputs.package_id }}`
          files: ${{ steps.outname.outputs.out_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
