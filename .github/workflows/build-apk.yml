name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nome da app'
        required: true
      package_id:
        description: 'Package ID (ex: com.exemplo.app)'
        required: true
      source_mode:
        description: 'file ou url'
        required: true
        default: 'file'
      source_url:
        description: 'URL da app (só usado se source_mode = url)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar pasta www/
        run: |
          mkdir -p www
          if [ "${{ github.event.inputs.source_mode }}" = "url" ]; then
            cat > www/index.html <<EOF
          <!DOCTYPE html>
          <html><head><meta charset="utf-8">
          <script>window.location.replace("${{ github.event.inputs.source_url }}");</script>
          </head><body></body></html>
          EOF
          fi
          # em modo "file", www/index.html já foi commitado pelo index.html antes de disparar este workflow

      - name: Instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Inicializar projecto Capacitor
        run: npx cap init "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.package_id }}" --web-dir www

      - name: Adicionar plataforma Android
        run: npx cap add android

      - name: Gerar ícone da app
        run: |
          if [ -f resources/icon.png ]; then
            echo "Ícone personalizado encontrado — a gerar todos os tamanhos..."
            npx @capacitor/assets generate --android --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#000000'
          else
            echo "Sem ícone personalizado — a usar o ícone padrão do Capacitor."
          fi

      - name: Sincronizar
        run: npx cap sync android

      - name: Corrigir conflito de versões do Kotlin
        run: |
          cat >> android/app/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
              }
          }
          EOF

      - name: Gerar keystore de assinatura
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "A usar keystore fixa (secret KEYSTORE_BASE64) — assinatura consistente entre builds."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "STORE_PASS=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "⚠ Sem keystore fixa configurada — a gerar uma nova (apps futuras não vão poder atualizar esta instalação sem desinstalar primeiro)."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias appkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "android123" -keypass "android123" \
              -dname "CN=${{ github.event.inputs.app_name }}, OU=Dev, O=Dev, L=Lisboa, S=Lisboa, C=PT"
            echo "STORE_PASS=android123" >> $GITHUB_ENV
            echo "KEY_ALIAS=appkey" >> $GITHUB_ENV
            echo "KEY_PASS=android123" >> $GITHUB_ENV
          fi

      - name: Build APK assinado
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Renomear APK para o nome da app
        id: apkname
        run: |
          SAFE_NAME=$(echo "${{ github.event.inputs.app_name }}" \
            | iconv -f utf8 -t ascii//TRANSLIT 2>/dev/null \
            | sed -E 's/[^a-zA-Z0-9]+/-/g; s/^-+|-+$//g')
          if [ -z "$SAFE_NAME" ]; then SAFE_NAME="app"; fi
          echo "apk_name=$SAFE_NAME.apk" >> "$GITHUB_OUTPUT"
          cp "android/app/build/outputs/apk/release/app-release.apk" \
             "android/app/build/outputs/apk/release/$SAFE_NAME.apk"

      - name: Publicar Release com o APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "${{ github.event.inputs.app_name }} — build #${{ github.run_number }}"
          body: |
            APK gerado automaticamente a partir de `www/index.html` (ou URL fornecido).
            Package: `${{ github.event.inputs.package_id }}`
          files: android/app/build/outputs/apk/release/${{ steps.apkname.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
