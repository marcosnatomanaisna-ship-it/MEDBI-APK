name: Build APK/AAB

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nome da app'
        required: true
      package_id:
        description: 'Package ID (ex: com.exemplo.app)'
        required: true
      source_mode:
        description: 'file, url ou decompiled (projeto smali/+res/+AndroidManifest.xml gerado pelo apktool)'
        required: true
        default: 'file'
        type: choice
        options:
          - file
          - url
          - decompiled
      source_url:
        description: 'URL da app (só usado se source_mode = url)'
        required: false
        default: ''
      output_format:
        description: 'apk ou aab (aab não é suportado em source_mode=decompiled — o apktool só reconstrói APK)'
        required: true
        default: 'apk'
      keep_original_package:
        description: 'Só em source_mode=decompiled: manter o package original do AndroidManifest.xml em vez do package_id acima?'
        required: false
        default: 'sim'
        type: choice
        options:
          - sim
          - nao
      force_new_keystore:
        description: 'Ignorar o KEYSTORE_BASE64 fixo (se existir) e gerar uma keystore nova só para este build?'
        required: false
        default: 'nao'
        type: choice
        options:
          - nao
          - sim
      splash_color:
        description: 'Cor de fundo do splash screen (hex, ex: #FDE2DD)'
        required: false
        default: '#FDE2DD'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Validar combinação de inputs
        run: |
          if [ "${{ github.event.inputs.source_mode }}" = "decompiled" ] && [ "${{ github.event.inputs.output_format }}" = "aab" ]; then
            echo "✗ source_mode=decompiled só produz APK — o apktool reconstrói um APK, não um App Bundle. Corre novamente com output_format=apk."
            exit 1
          fi

      - name: Configurar Node.js
        if: ${{ github.event.inputs.source_mode != 'decompiled' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar cache do Gradle
        if: ${{ github.event.inputs.source_mode != 'decompiled' }}
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar pasta www/
        if: ${{ github.event.inputs.source_mode != 'decompiled' }}
        run: |
          mkdir -p www
          if [ "${{ github.event.inputs.source_mode }}" = "url" ]; then
            cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"></head><body>A carregar…</body></html>
          EOF
          fi
          # em modo "file", www/index.html já foi commitado pelo backend antes de disparar este workflow.
          # em modo "url" este ficheiro é só um fallback local — quem manda é o
          # server.url do capacitor.config.json, configurado no passo seguinte.

      - name: "Preparar pasta decompiled/ (projeto do apk-unpack — manifest/+resources/+smali/+java/)"
        # Tal como em modo "file", o backend já commitou "decompiled.zip" na raiz
        # do repo antes de disparar este workflow — este passo extrai e depois
        # REORGANIZA, porque o zip que sai da tua app "destrói" (apk-decompile,
        # decompile.yml) não vem já na forma que o "apktool b" exige. Vem assim:
        #
        #   manifest/AndroidManifest.xml
        #   resources/res/...
        #   smali/smali/...  smali/smali_classes2/...
        #   java/...            ← código Java aproximado (jadx), só para LERES;
        #                         o apktool não o usa para reconstruir nada.
        #   assets/...          (opcional)
        #   apktool.yml         (metadados de reconstrução)
        #
        # e o "apktool b" precisa disto na raiz do projeto:
        #
        #   AndroidManifest.xml, res/, smali/, smali_classes2/, assets/, apktool.yml
        #
        # Se editaste código, tem de ser dentro de smali/ — editar os .java em
        # java/ não tem qualquer efeito no .apk reconstruído.
        if: ${{ github.event.inputs.source_mode == 'decompiled' }}
        run: |
          if [ ! -f decompiled.zip ]; then
            echo "✗ decompiled.zip não encontrado na raiz do repo — o backend tem de o commitar antes de disparar o workflow em source_mode=decompiled."
            exit 1
          fi
          rm -rf decompiled
          mkdir -p decompiled
          unzip -q decompiled.zip -d decompiled

          # Se o zip tiver uma única pasta-raiz, sobe o conteúdo um nível.
          ENTRIES=(decompiled/*)
          if [ "${#ENTRIES[@]}" -eq 1 ] && [ -d "${ENTRIES[0]}" ]; then
            mv "${ENTRIES[0]}"/* decompiled/
            rmdir "${ENTRIES[0]}"
          fi

          echo "--- conteúdo recebido (antes de reorganizar) ---"
          find decompiled -maxdepth 1

          # manifest/AndroidManifest.xml -> AndroidManifest.xml
          if [ -f decompiled/manifest/AndroidManifest.xml ]; then
            mv decompiled/manifest/AndroidManifest.xml decompiled/AndroidManifest.xml
            rm -rf decompiled/manifest
          fi

          # resources/res -> res
          if [ -d decompiled/resources/res ]; then
            mv decompiled/resources/res decompiled/res
          fi
          rm -rf decompiled/resources

          # smali/smali -> smali, smali/smali_classes2 -> smali_classes2, etc.
          if [ -d decompiled/smali ]; then
            mv decompiled/smali decompiled/__smali_bundle
            for d in decompiled/__smali_bundle/*/; do
              [ -d "$d" ] || continue
              mv "$d" "decompiled/$(basename "${d%/}")"
            done
            rm -rf decompiled/__smali_bundle
          fi

          # java/ é só leitura (jadx) — o apktool não sabe o que fazer com ele
          # e não deve ir parar dentro do .apk reconstruído.
          rm -rf decompiled/java

          # assets/ e apktool.yml já ficam na raiz certa depois do "sobe um nível" acima — nada a fazer.

          echo "--- conteúdo reorganizado (pronto para apktool b) ---"
          find decompiled -maxdepth 1

          if [ ! -f decompiled/AndroidManifest.xml ]; then
            echo "✗ AndroidManifest.xml não encontrado depois de reorganizar — confirma que o zip veio da tua app de descompilação (apk-unpack) com a estrutura manifest/+smali/+resources/."
            exit 1
          fi
          if [ ! -f decompiled/apktool.yml ]; then
            echo "⚠ apktool.yml não encontrado — se a tua app 'destrói' ainda não foi atualizada para o incluir no zip, a reconstrução pode falhar ou gerar um .apk com compressão/versão erradas. Atualiza o decompile.yml para incluir 'apktool.yml' no resultado."
          fi

      - name: Cache de dependências npm (Capacitor)
        if: ${{ github.event.inputs.source_mode != 'decompiled' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: capacitor-deps-${{ runner.os }}-v2

      - name: Instalar Capacitor
        if: ${{ github.event.inputs.source_mode != 'decompiled' }}
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Inicializar configuração do Capacitor
        # Escrevemos o capacitor.config.json à mão em vez de usar "npx cap init":
        # nas versões atuais do CLI, "cap init" gera capacitor.config.TS (não .json),
        # e o passo seguinte (server.url em modo url) precisa de encontrar o .json.
        # Isto também evita ambiguidade: com os dois ficheiros a existir, o Capacitor
        # prioriza o .ts e as edições feitas ao .json seriam ignoradas.
        if: ${{ github.event.inputs.source_mode != 'decompiled' }}
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          PACKAGE_ID: ${{ github.event.inputs.package_id }}
        run: |
          node -e "
            const fs = require('fs');
            const cfg = {
              appId: process.env.PACKAGE_ID,
              appName: process.env.APP_NAME,
              webDir: 'www'
            };
            fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
            console.log('capacitor.config.json:', JSON.stringify(cfg, null, 2));
          "

      - name: Configurar server.url (modo url — WebView vivo, tipo AppMint)
        if: ${{ github.event.inputs.source_mode == 'url' }}
        env:
          SOURCE_URL: ${{ github.event.inputs.source_url }}
        run: |
          node -e "
            const fs = require('fs');
            const path = 'capacitor.config.json';
            const cfg = JSON.parse(fs.readFileSync(path, 'utf8'));
            const url = process.env.SOURCE_URL;
            cfg.server = cfg.server || {};
            cfg.server.url = url;
            cfg.server.cleartext = url.startsWith('http://');
            fs.writeFileSync(path, JSON.stringify(cfg, null, 2));
            console.log('capacitor.config.json:', JSON.stringify(cfg, null, 2));
          "

      - name: Adicionar plataforma Android
        if: ${{ github.event.inputs.source_mode != 'decompiled' }}
        run: npx cap add android

      - name: Permissão de armazenamento (fallback download em Android < 10)
        if: ${{ github.event.inputs.source_mode != 'decompiled' }}
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <application#' "$MANIFEST"
          echo "--- AndroidManifest.xml ---"
          cat "$MANIFEST"

      - name: Configurar botão "Voltar" e saída da app
        # Substitui o MainActivity.java gerado pelo "cap add android" (que por
        # omissão só tem "public class MainActivity extends BridgeActivity {}"),
        # por uma versão que trata o botão/gesto "Voltar" do Android:
        # se a WebView tiver histórico (ex: navegou de uma página para outra
        # dentro da app), volta um passo atrás nesse histórico em vez de
        # fechar a app de imediato. Só quando já não há mais histórico
        # (ecrã inicial) é que pergunta "Queres sair da aplicação?" antes
        # de fechar. Sem botão flutuante — nada sobreposto ao conteúdo.
        #
        # Nativo (não JS/CSS injetado na página) — funciona da mesma forma em
        # modo "file"/"zip" (HTML embutido) e em modo "url" (WebView aponta
        # para um site externo, onde não há como controlar o HTML da página).
        if: ${{ github.event.inputs.source_mode != 'decompiled' }}
        env:
          PACKAGE_ID: ${{ github.event.inputs.package_id }}
        run: |
          PKG_PATH=$(echo "$PACKAGE_ID" | tr '.' '/')
          MAIN_ACTIVITY="android/app/src/main/java/$PKG_PATH/MainActivity.java"
          if [ ! -f "$MAIN_ACTIVITY" ]; then
            echo "⚠ não encontrei $MAIN_ACTIVITY pelo caminho esperado — a procurar..."
            MAIN_ACTIVITY=$(find android/app/src/main/java -name MainActivity.java | head -n1)
          fi
          echo "a editar: $MAIN_ACTIVITY"

          cat > "$MAIN_ACTIVITY" <<EOF
          package $PACKAGE_ID;

          import android.app.AlertDialog;
          import android.app.DownloadManager;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.Toast;
          import androidx.webkit.WebViewCompat;
          import androidx.webkit.WebViewFeature;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.util.Collections;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  final WebView webView = this.bridge.getWebView();

                  // Ponte JS -> Android: permite às apps (Blob/base64) gravar
                  // ficheiros no telemóvel (exportar Word, PDF, imagens, etc.).
                  webView.addJavascriptInterface(new DownloadBridge(this), "AndroidDownload");

                  // Corre ANTES do JS da própria página (document-start), para
                  // apanhar o Blob e o nome real do ficheiro (atributo "download"
                  // do <a>) logo na origem — assim o ficheiro guardado fica com o
                  // nome que a app deu, em vez de "download_<timestamp>".
                  if (WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)) {
                      String patchJs =
                          "(function(){" +
                          "  if (window.__adPatched) return;" +
                          "  window.__adPatched = true;" +
                          "  var cache = {};" +
                          "  var origCreate = URL.createObjectURL.bind(URL);" +
                          "  URL.createObjectURL = function(blob){" +
                          "    var u = origCreate(blob);" +
                          "    cache[u] = blob;" +
                          "    return u;" +
                          "  };" +
                          "  function handle(a){" +
                          "    try {" +
                          "      var href = a.href || '';" +
                          "      var name = a.download || '';" +
                          "      if (href.indexOf('blob:') === 0 && name && window.AndroidDownload) {" +
                          "        var blob = cache[href];" +
                          "        if (blob) {" +
                          "          var reader = new FileReader();" +
                          "          reader.onloadend = function(){" +
                          "            var base64 = reader.result.split(',')[1];" +
                          "            window.AndroidDownload.saveBase64(base64, name, blob.type || 'application/octet-stream');" +
                          "          };" +
                          "          reader.readAsDataURL(blob);" +
                          "          return true;" +
                          "        }" +
                          "      }" +
                          "    } catch(e) {}" +
                          "    return false;" +
                          "  }" +
                          "  var origClick = HTMLAnchorElement.prototype.click;" +
                          "  HTMLAnchorElement.prototype.click = function(){" +
                          "    if (handle(this)) return;" +
                          "    return origClick.call(this);" +
                          "  };" +
                          "  document.addEventListener('click', function(ev){" +
                          "    var a = ev.target.closest ? ev.target.closest('a[download]') : null;" +
                          "    if (a && handle(a)) { ev.preventDefault(); ev.stopPropagation(); }" +
                          "  }, true);" +
                          "})();";
                      WebViewCompat.addDocumentStartJavaScript(webView, patchJs, Collections.singleton("*"));
                  }

                  // Sem isto, a WebView do Android não faz NADA quando a página
                  // tenta descarregar algo (blob:, data: ou http com anexo) —
                  // é a causa de botões de "descarregar/exportar" ficarem mudos.
                  webView.setDownloadListener((url, userAgent, contentDisposition, mimetype, contentLength) -> {
                      String filename = guessFilename(contentDisposition, mimetype);
                      if (url.startsWith("data:")) {
                          try {
                              String[] parts = url.split(",", 2);
                              String meta = parts[0];
                              String data = parts.length > 1 ? parts[1] : "";
                              String mt = mimetype;
                              if (meta.contains(":") && meta.contains(";")) {
                                  mt = meta.substring(meta.indexOf(":") + 1, meta.indexOf(";"));
                              }
                              new DownloadBridge(this).saveBase64(data, filename, mt);
                          } catch (Exception e) {
                              Toast.makeText(this, "Erro ao processar ficheiro.", Toast.LENGTH_SHORT).show();
                          }
                      } else if (url.startsWith("blob:")) {
                          String safeName = filename.replace("'", "");
                          String js =
                              "(function(){" +
                              "  fetch('" + url + "').then(function(r){return r.blob();}).then(function(blob){" +
                              "    var reader = new FileReader();" +
                              "    reader.onloadend = function(){" +
                              "      var base64 = reader.result.split(',')[1];" +
                              "      AndroidDownload.saveBase64(base64, '" + safeName + "', blob.type || '" + mimetype + "');" +
                              "    };" +
                              "    reader.readAsDataURL(blob);" +
                              "  }).catch(function(e){ console.log('download error', e); });" +
                              "})();";
                          webView.evaluateJavascript(js, null);
                      } else {
                          try {
                              DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                              request.setMimeType(mimetype);
                              request.addRequestHeader("User-Agent", userAgent);
                              request.setTitle(filename);
                              request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                              request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, filename);
                              DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                              dm.enqueue(request);
                              Toast.makeText(this, "A descarregar " + filename, Toast.LENGTH_SHORT).show();
                          } catch (Exception e) {
                              Toast.makeText(this, "Erro ao descarregar.", Toast.LENGTH_SHORT).show();
                          }
                      }
                  });
              }

              private String guessFilename(String contentDisposition, String mimetype) {
                  String filename = null;
                  if (contentDisposition != null && contentDisposition.contains("filename=")) {
                      filename = contentDisposition.replaceAll(".*filename=\"?([^\";]+)\"?.*", "\$1");
                  }
                  if (filename == null || filename.isEmpty() || filename.equals(contentDisposition)) {
                      String ext = "";
                      if (mimetype != null) {
                          if (mimetype.contains("word")) ext = ".docx";
                          else if (mimetype.contains("pdf")) ext = ".pdf";
                          else if (mimetype.contains("sheet") || mimetype.contains("excel")) ext = ".xlsx";
                          else if (mimetype.contains("presentation")) ext = ".pptx";
                          else if (mimetype.contains("png")) ext = ".png";
                          else if (mimetype.contains("jpeg")) ext = ".jpg";
                          else if (mimetype.contains("json")) ext = ".json";
                          else if (mimetype.contains("csv")) ext = ".csv";
                          else if (mimetype.contains("text")) ext = ".txt";
                      }
                      filename = "download_" + System.currentTimeMillis() + ext;
                  }
                  return filename;
              }

              public class DownloadBridge {
                  private final MainActivity activity;
                  DownloadBridge(MainActivity activity) { this.activity = activity; }

                  @JavascriptInterface
                  public void saveBase64(String base64, String filename, String mimetype) {
                      activity.runOnUiThread(() -> {
                          try {
                              byte[] bytes = Base64.decode(base64, Base64.DEFAULT);
                              Uri savedUri = null;
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                  ContentValues values = new ContentValues();
                                  values.put(MediaStore.MediaColumns.DISPLAY_NAME, filename);
                                  values.put(MediaStore.MediaColumns.MIME_TYPE, mimetype);
                                  values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                                  Uri uri = activity.getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                                  if (uri != null) {
                                      OutputStream out = activity.getContentResolver().openOutputStream(uri);
                                      if (out != null) { out.write(bytes); out.close(); }
                                      savedUri = uri;
                                  }
                              } else {
                                  File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                                  File file = new File(dir, filename);
                                  FileOutputStream fos = new FileOutputStream(file);
                                  fos.write(bytes);
                                  fos.close();
                                  activity.sendBroadcast(new Intent(Intent.ACTION_MEDIA_SCANNER_SCAN_FILE, Uri.fromFile(file)));
                                  savedUri = Uri.fromFile(file);
                              }

                              if (savedUri != null) {
                                  Toast.makeText(activity, "Descarregado: " + filename, Toast.LENGTH_LONG).show();
                                  try {
                                      Intent viewIntent = new Intent(Intent.ACTION_VIEW);
                                      viewIntent.setDataAndType(savedUri, mimetype);
                                      viewIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                      viewIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                      activity.startActivity(viewIntent);
                                  } catch (Exception ignored) {
                                      // sem app para abrir o ficheiro — fica só na pasta Downloads
                                  }
                              } else {
                                  Toast.makeText(activity, "Erro ao guardar " + filename, Toast.LENGTH_LONG).show();
                              }
                          } catch (Exception e) {
                              Toast.makeText(activity, "Erro ao guardar ficheiro: " + e.getMessage(), Toast.LENGTH_LONG).show();
                          }
                      });
                  }
              }

              @Override
              public void onBackPressed() {
                  WebView webView = this.bridge.getWebView();
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      confirmExit();
                  }
              }

              private void confirmExit() {
                  new AlertDialog.Builder(this)
                      .setTitle("Sair da aplicação")
                      .setMessage("Queres sair da aplicação?")
                      .setPositiveButton("Sair", (dialog, which) -> {
                          finishAffinity();
                          System.exit(0);
                      })
                      .setNegativeButton("Cancelar", (dialog, which) -> dialog.dismiss())
                      .setCancelable(true)
                      .show();
              }
          }
          EOF
          echo "--- MainActivity.java final ---"
          cat "$MAIN_ACTIVITY"

      - name: Gerar ícone e splash screen da app
        if: ${{ github.event.inputs.source_mode != 'decompiled' }}
        run: |
          RAW_COLOR="${{ github.event.inputs.splash_color }}"
          if [[ "$RAW_COLOR" =~ ^#[0-9A-Fa-f]{6}$ ]]; then
            SPLASH_COLOR="$RAW_COLOR"
          else
            echo "⚠ cor de splash inválida ou vazia ('$RAW_COLOR') — a usar default #FDE2DD."
            SPLASH_COLOR="#FDE2DD"
          fi
          echo "Cor de fundo do splash: $SPLASH_COLOR"
          echo "SPLASH_COLOR=$SPLASH_COLOR" >> "$GITHUB_ENV"

          if [ -f resources/icon.png ]; then
            echo "Ícone personalizado encontrado — a gerar todos os tamanhos (ícone + splash)..."
            npx @capacitor/assets generate --android \
              --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#000000' \
              --splashBackgroundColor "$SPLASH_COLOR" --splashBackgroundColorDark "$SPLASH_COLOR"
          else
            echo "Sem ícone personalizado — a usar o ícone padrão do Capacitor, mas a aplicar a cor de splash escolhida."
            mkdir -p resources
            # gera um splash mínimo 1x1 na cor escolhida para o @capacitor/assets ter uma fonte a partir da qual trabalhar
            npx @capacitor/assets generate --android \
              --splashBackgroundColor "$SPLASH_COLOR" --splashBackgroundColorDark "$SPLASH_COLOR"
          fi

      - name: Sincronizar
        if: ${{ github.event.inputs.source_mode != 'decompiled' }}
        run: npx cap sync android

      - name: Forçar cor do splash no Android 12+ (API 31)
        # O @capacitor/assets atualiza os recursos "clássicos" (values/colors.xml,
        # drawable), mas a partir do Android 12 o sistema usa a Splash Screen API
        # nativa, que lê a cor de values-v31/styles.xml (windowSplashScreenBackground).
        # Se essa versão do tema não estiver alinhada, o telemóvel ignora a cor
        # escolhida e mostra a cor por defeito. Este passo força-a diretamente.
        if: ${{ github.event.inputs.source_mode != 'decompiled' }}
        run: |
          STYLES="android/app/src/main/res/values/styles.xml"
          echo "--- styles.xml antes da alteração ---"
          cat "$STYLES" || echo "(styles.xml não encontrado em $STYLES)"

          mkdir -p android/app/src/main/res/values-v31
          cat > android/app/src/main/res/values-v31/styles.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">${SPLASH_COLOR}</item>
                  <item name="windowSplashScreenAnimatedIcon">@mipmap/ic_launcher</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
              </style>
          </resources>
          EOF

          echo "--- values-v31/styles.xml gerado ---"
          cat android/app/src/main/res/values-v31/styles.xml

      - name: Corrigir conflito de versões do Kotlin
        if: ${{ github.event.inputs.source_mode != 'decompiled' }}
        run: |
          cat >> android/app/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.14.0'
          }
          EOF

      - name: Otimizar definições do Gradle (paralelismo + cache de build)
        if: ${{ github.event.inputs.source_mode != 'decompiled' }}
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configureondemand=true
          org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC
          EOF

      - name: Gerar keystore de assinatura
        env:
          # Nunca interpolar ${{ github.event.inputs.* }} diretamente dentro
          # de um bloco "run:" — o GitHub Actions substitui isso por texto
          # ANTES do bash correr, por isso um app_name com aspas/backticks
          # conseguiria injetar comandos no runner (que tem acesso à
          # keystore). Passar por variável de ambiente evita isso: o valor
          # chega ao bash já como uma string normal, nunca como código.
          APP_NAME: ${{ github.event.inputs.app_name }}
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ "${{ github.event.inputs.force_new_keystore }}" != "sim" ]; then
            echo "A usar keystore fixa (secret KEYSTORE_BASE64) — assinatura consistente entre builds."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "STORE_PASS=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            if [ "${{ github.event.inputs.force_new_keystore }}" = "sim" ]; then
              echo "⚠ force_new_keystore=sim — a ignorar a keystore fixa e a gerar uma nova só para este build (a app resultante não vai poder ser atualizada por cima de instalações assinadas com outra keystore)."
            else
              echo "⚠ Sem keystore fixa configurada — a gerar uma nova (apps futuras não vão poder atualizar esta instalação sem desinstalar primeiro)."
            fi
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias appkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "android123" -keypass "android123" \
              -dname "CN=$APP_NAME, OU=Dev, O=Dev, L=Lisboa, S=Lisboa, C=PT"
            echo "STORE_PASS=android123" >> $GITHUB_ENV
            echo "KEY_ALIAS=appkey" >> $GITHUB_ENV
            echo "KEY_PASS=android123" >> $GITHUB_ENV
          fi

      - name: Build APK/AAB assinado
        if: ${{ github.event.inputs.source_mode != 'decompiled' }}
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "${{ github.event.inputs.output_format }}" = "aab" ]; then
            echo "A gerar AAB (bundleRelease)..."
            ./gradlew bundleRelease --build-cache --parallel \
              -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
              -Pandroid.injected.signing.store.password="$STORE_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
          else
            echo "A gerar APK (assembleRelease)..."
            ./gradlew assembleRelease --build-cache --parallel \
              -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
              -Pandroid.injected.signing.store.password="$STORE_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
          fi

      - name: Renomear package no projeto descompilado (manifesto + smali + recursos)
        # Por omissão (keep_original_package=sim) não mexemos em nada.
        #
        # Quando pedido, isto faz um rename "a sério", não só o atributo
        # package= do manifesto:
        #   1. Move as pastas smali/<caminho-antigo> (e smali_classes2/, etc.,
        #      se existirem) para smali/<caminho-novo>, refletindo o novo
        #      appId na estrutura de diretórios.
        #   2. Substitui todas as ocorrências do package antigo — em forma
        #      "com.exemplo.app" e "com/exemplo/app" — dentro de todos os
        #      .smali e .xml do projeto (referências de classe entre
        #      arquivos, o atributo package= e android:name= do manifesto,
        #      authorities de ContentProvider, etc.)
        #
        # Limitação que fica por resolver automaticamente: se a app tiver
        # bibliotecas nativas (.so) que comparem o nome do pacote em código
        # C/C++ (ex: verificação de integridade/assinatura embutida no
        # nativo), isto não é tocado — só texto em smali/xml é substituído.
        if: ${{ github.event.inputs.source_mode == 'decompiled' && github.event.inputs.keep_original_package == 'nao' }}
        env:
          PACKAGE_ID: ${{ github.event.inputs.package_id }}
        run: |
          OLD_PKG=$(grep -o 'package="[^"]*"' decompiled/AndroidManifest.xml | head -n1 | sed 's/package="//;s/"//')
          NEW_PKG="$PACKAGE_ID"
          if [ -z "$OLD_PKG" ]; then
            echo "✗ não consegui ler o atributo package= do AndroidManifest.xml original — abortando rename."
            exit 1
          fi
          if [ "$OLD_PKG" = "$NEW_PKG" ]; then
            echo "Package novo é igual ao original ($OLD_PKG) — nada a fazer."
            exit 0
          fi
          OLD_PATH=$(echo "$OLD_PKG" | tr '.' '/')
          NEW_PATH=$(echo "$NEW_PKG" | tr '.' '/')
          echo "Package original: $OLD_PKG ($OLD_PATH)"
          echo "Package novo:     $NEW_PKG ($NEW_PATH)"

          # 1) Mover as pastas smali*/<caminho-antigo> -> smali*/<caminho-novo>
          for smalidir in decompiled/smali*/; do
            [ -d "$smalidir" ] || continue
            if [ -d "${smalidir}${OLD_PATH}" ]; then
              mkdir -p "$(dirname "${smalidir}${NEW_PATH}")"
              mv "${smalidir}${OLD_PATH}" "${smalidir}${NEW_PATH}"
              echo "  movido: ${smalidir}${OLD_PATH} → ${smalidir}${NEW_PATH}"
            fi
          done

          # 2) Substituir todas as referências textuais (forma com pontos e com barras)
          #    em .smali e .xml do projeto inteiro (inclui AndroidManifest.xml e res/).
          #    IMPORTANTE: a lista de ficheiros vem separada por NUL (grep -Z) e tem de
          #    ir DIRETO para o xargs -0, sem passar por uma variável bash — capturar
          #    NUL bytes num $(...) faz o bash descartá-los e colar os nomes de ficheiro
          #    todos uns a seguir aos outros (foi isso que causou o erro anterior).
          grep -rlZ -e "$OLD_PKG" -e "$OLD_PATH" \
            --include='*.smali' --include='*.xml' decompiled 2>/dev/null \
            | xargs -0 -r sed -i \
              -e "s#${OLD_PATH}#${NEW_PATH}#g" \
              -e "s#${OLD_PKG}#${NEW_PKG}#g"

          echo "--- confirmação ---"
          grep 'package=' decompiled/AndroidManifest.xml
          REMAINING=$(grep -rl -e "$OLD_PKG" -e "$OLD_PATH" --include='*.smali' --include='*.xml' decompiled 2>/dev/null | wc -l)
          echo "Ficheiros .smali/.xml que ainda mencionam o package antigo: $REMAINING"
          if [ "$REMAINING" -gt 0 ]; then
            echo "  (normal se forem strings/comentários não relacionados com a identidade da app — revê se o build seguinte falhar)"
          fi

      - name: Instalar apktool + build-tools (aapt2, zipalign, apksigner)
        if: ${{ github.event.inputs.source_mode == 'decompiled' }}
        run: |
          # NÃO usar "apt-get install apktool" — o pacote do Ubuntu é uma versão
          # antiga com patches próprios ("2.7.0-dirty") com um bug conhecido: o
          # aapt embutido nem sempre vem incluído no .jar, e o apktool cai para o
          # aapt que encontrar no $PATH, que é incompatível ("Could not extract
          # resource: /prebuilt/linux/aapt_64", "First type is not attr!",
          # crash com exit code 134). Instala-se a versão oficial diretamente do
          # GitHub, que já traz o aapt2 embutido e correto.
          APKTOOL_VERSION="3.0.2"
          sudo curl -sL -o /usr/local/bin/apktool \
            https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          sudo curl -sL -o /usr/local/bin/apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

          # zipalign/apksigner vêm nas cmdline-tools/build-tools do Android SDK,
          # que o runner ubuntu-latest já traz pré-instalado via ANDROID_HOME.
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n1)
          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> "$GITHUB_ENV"
          echo "A usar build-tools em: $BUILD_TOOLS_DIR"
          "$BUILD_TOOLS_DIR/apksigner" --version
          "$BUILD_TOOLS_DIR/zipalign" 2>&1 | head -n1 || true

      - name: Remover exigência de splits (isSplitRequired / requiredSplitTypes / splitTypes)
        # Apps publicadas na Play Store como "App Bundle com isolated splits"
        # ou "Play Feature Delivery" trazem uma destas flags no
        # AndroidManifest.xml (a Google mudou o mecanismo ao longo do tempo,
        # por isso cobrimos todas as variantes conhecidas):
        #   android:isSplitRequired="true"          (API 28+)
        #   android:requiredSplitTypes="..."        (API 31+)
        #   android:splitTypes="..."                (API 31+)
        # Isto diz ao Android "recusa instalar-me sem as outras peças (splits)
        # que vieram comigo" — mesmo quando o .apk reconstruído já é único e
        # autossuficiente. São só travas de instalação, não afetam o
        # funcionamento da app; por isso desligamo-las/removemo-las antes de
        # reconstruir.
        if: ${{ github.event.inputs.source_mode == 'decompiled' }}
        run: |
          echo "--- linhas do manifesto que mencionam 'split' (antes) ---"
          grep -in 'split' decompiled/AndroidManifest.xml || echo "(nenhuma ocorrência de 'split' no manifesto)"
          echo ""

          CHANGED=0

          if grep -q 'isSplitRequired="true"' decompiled/AndroidManifest.xml; then
            sed -i 's/android:isSplitRequired="true"/android:isSplitRequired="false"/g' decompiled/AndroidManifest.xml
            echo "✓ isSplitRequired mudado de true para false."
            CHANGED=1
          fi

          if grep -q 'requiredSplitTypes="' decompiled/AndroidManifest.xml; then
            sed -i -E 's/[[:space:]]*android:requiredSplitTypes="[^"]*"//g' decompiled/AndroidManifest.xml
            echo "✓ requiredSplitTypes removido."
            CHANGED=1
          fi

          if grep -q 'splitTypes="' decompiled/AndroidManifest.xml; then
            sed -i -E 's/[[:space:]]*android:splitTypes="[^"]*"//g' decompiled/AndroidManifest.xml
            echo "✓ splitTypes removido."
            CHANGED=1
          fi

          if [ "$CHANGED" = "0" ]; then
            echo "(nenhuma das variantes conhecidas encontrada — nada mudado)"
          fi

          echo ""
          echo "--- linhas do manifesto que mencionam 'split' (depois) ---"
          grep -in 'split' decompiled/AndroidManifest.xml || echo "(nenhuma ocorrência de 'split' no manifesto)"

      - name: Reconstruir APK a partir do projeto descompilado (apktool)
        if: ${{ github.event.inputs.source_mode == 'decompiled' }}
        run: |
          apktool b decompiled -o app-unsigned.apk

      - name: Diagnóstico do APK reconstruído (versão mínima, arquiteturas nativas)
        if: ${{ github.event.inputs.source_mode == 'decompiled' }}
        run: |
          echo "--- AndroidManifest.xml original (decompiled/) ---"
          grep -o '<uses-sdk[^/]*/>' decompiled/AndroidManifest.xml || echo "(sem tag uses-sdk explícita — herda do apktool.yml)"
          echo ""
          echo "--- apktool.yml (sdkInfo) ---"
          grep -A5 'sdkInfo' decompiled/apktool.yml || echo "(sem sdkInfo em apktool.yml)"
          echo ""
          echo "--- arquiteturas nativas incluídas (pasta lib/) ---"
          if [ -d decompiled/lib ]; then
            find decompiled/lib -maxdepth 1 -mindepth 1 -type d -exec basename {} \;
          else
            echo "(sem pasta lib/ — app não tem código nativo, normal em apps WebView/Capacitor puras)"
          fi
          echo ""
          echo "--- badging completo do .apk reconstruído (aapt2 do Android SDK) ---"
          "$BUILD_TOOLS_DIR/aapt2" dump badging app-unsigned.apk 2>&1 || echo "(aapt2 do SDK falhou a ler o apk)"

      - name: Alinhar e assinar o APK reconstruído
        if: ${{ github.event.inputs.source_mode == 'decompiled' }}
        run: |
          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 app-unsigned.apk app-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.keystore \
            --ks-pass "pass:$STORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out android-app-decompiled-release.apk \
            app-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" verify android-app-decompiled-release.apk && echo "✓ assinatura válida"
          echo ""
          echo "--- badging do .apk FINAL assinado (para comparar com o não-assinado) ---"
          "$BUILD_TOOLS_DIR/aapt2" dump badging android-app-decompiled-release.apk 2>&1 | head -n 20 || echo "(aapt2 falhou a ler o apk assinado)"

      - name: Renomear ficheiro final para o nome da app
        id: outname
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
        run: |
          SAFE_NAME=$(echo "$APP_NAME" \
            | iconv -f utf8 -t ascii//TRANSLIT 2>/dev/null \
            | sed -E 's/[^a-zA-Z0-9]+/-/g; s/^-+|-+$//g')
          if [ -z "$SAFE_NAME" ]; then SAFE_NAME="app"; fi

          if [ "${{ github.event.inputs.source_mode }}" = "decompiled" ]; then
            SRC="android-app-decompiled-release.apk"
            OUT_NAME="$SAFE_NAME.apk"
          elif [ "${{ github.event.inputs.output_format }}" = "aab" ]; then
            SRC="android/app/build/outputs/bundle/release/app-release.aab"
            OUT_NAME="$SAFE_NAME.aab"
          else
            SRC="android/app/build/outputs/apk/release/app-release.apk"
            OUT_NAME="$SAFE_NAME.apk"
          fi
          DEST="$(dirname "$SRC")/$OUT_NAME"
          cp "$SRC" "$DEST"
          echo "out_name=$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "out_path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Publicar Release com o ficheiro gerado
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "${{ github.event.inputs.app_name }} — build #${{ github.run_number }}"
          body: |
            ${{ github.event.inputs.output_format == 'aab' && 'AAB (Android App Bundle)' || 'APK' }} gerado automaticamente.
            Modo: `${{ github.event.inputs.source_mode }}`${{ github.event.inputs.source_mode == 'url' && format(' — WebView aponta para {0} (app vai buscar sempre a versão mais recente, sem precisar de rebuild)', github.event.inputs.source_url) || (github.event.inputs.source_mode == 'decompiled' && ' — reconstruído com apktool a partir de projeto smali/+res/ descompilado' || ' — conteúdo embutido offline no APK') }}
            Package: `${{ github.event.inputs.package_id }}`${{ github.event.inputs.source_mode == 'decompiled' && github.event.inputs.keep_original_package == 'sim' && ' (mantido o package original do APK descompilado, não este)' || '' }}
          files: ${{ steps.outname.outputs.out_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
