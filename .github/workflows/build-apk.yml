name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nome da app'
        required: true
      package_id:
        description: 'Package ID (ex: com.exemplo.app)'
        required: true
      source_mode:
        description: 'file ou url'
        required: true
        default: 'file'
      source_url:
        description: 'URL da app (só usado se source_mode = url)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar pasta www/
        run: |
          mkdir -p www
          if [ "${{ github.event.inputs.source_mode }}" = "url" ]; then
            cat > www/index.html <<EOF
          <!DOCTYPE html>
          <html><head><meta charset="utf-8">
          <script>window.location.replace("${{ github.event.inputs.source_url }}");</script>
          </head><body></body></html>
          EOF
          fi
          # em modo "file", www/index.html já foi commitado pelo index.html antes de disparar este workflow

      - name: Instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Inicializar projecto Capacitor
        run: npx cap init "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.package_id }}" --web-dir www

      - name: Adicionar plataforma Android
        run: npx cap add android

      - name: Sincronizar
        run: npx cap sync android

      - name: Gerar keystore de assinatura
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias appkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "android123" -keypass "android123" \
            -dname "CN=${{ github.event.inputs.app_name }}, OU=Dev, O=Dev, L=Lisboa, S=Lisboa, C=PT"

      - name: Build APK assinado
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
            -Pandroid.injected.signing.store.password=android123 \
            -Pandroid.injected.signing.key.alias=appkey \
            -Pandroid.injected.signing.key.password=android123

      - name: Publicar Release com o APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "${{ github.event.inputs.app_name }} — build #${{ github.run_number }}"
          body: |
            APK gerado automaticamente a partir de `www/index.html` (ou URL fornecido).
            Package: `${{ github.event.inputs.package_id }}`
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
