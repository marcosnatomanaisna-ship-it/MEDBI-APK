name: apk-decompile

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID do job (gerado pelo backend)"
        required: true
      apk_path:
        description: "caminho do .apk (ou .zip com base.apk + splits) dentro do repo (ex: incoming/xxx-app.apk)"
        required: true
      want_smali:
        description: "true/false"
        required: false
        default: "true"
      want_java:
        description: "true/false"
        required: false
        default: "true"
      want_resources:
        description: "true/false"
        required: false
        default: "true"
      app_only:
        description: "true = só o código da própria app (recomendado); false = inclui bibliotecas Android/Kotlin/AndroidX também"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preparar pastas
        run: mkdir -p work/apktool_out work/jadx_out work/final

      - name: Diagnóstico — confirmar que o apk está presente (com auto-recuperação)
        run: |
          BRANCH="${{ github.ref_name }}"
          for tentativa in 1 2 3; do
            if [ -f "${{ github.event.inputs.apk_path }}" ]; then
              echo "✓ ficheiro encontrado na tentativa $tentativa, $(stat -c%s "${{ github.event.inputs.apk_path }}") bytes"
              exit 0
            fi
            echo "✗ tentativa $tentativa: ficheiro ainda não visível — pode ser atraso de propagação do commit feito pela API. A tentar atualizar o checkout..."
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            sleep 3
          done
          echo "✗ ficheiro definitivamente não encontrado após 3 tentativas: ${{ github.event.inputs.apk_path }}"
          ls -la incoming/ 2>/dev/null || echo "(pasta incoming/ não existe)"
          git log --oneline -5
          exit 1

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar .apk único (fundir splits, se o envio for um .zip)
        # O apktool/jadx só sabem lidar com UM .apk. Se a app foi extraída
        # como bundle (base.apk + split_config.*.apk, comum em apps
        # modernas da Play Store), o ficheiro enviado é um .zip com várias
        # peças lá dentro — aqui fundimo-las num único .apk autossuficiente
        # com o APKEditor antes de seguir para o resto do processo, que
        # fica inalterado. Isto também resolve o erro de instalação
        # "isSplitRequired"/"requiredSplitTypes" na origem, já que o .apk
        # fundido deixa de depender de splits em falta.
        run: |
          SRC="${{ github.event.inputs.apk_path }}"
          if [[ "$SRC" == *.zip ]]; then
            echo "ficheiro enviado é um .zip — a extrair e a procurar splits..."
            mkdir -p work/splits_in
            unzip -q "$SRC" -d work/splits_in
            APK_COUNT=$(find work/splits_in -maxdepth 2 -iname "*.apk" | wc -l)
            echo "encontrados $APK_COUNT ficheiros .apk dentro do zip."
            if [ "$APK_COUNT" -lt 1 ]; then
              echo "✗ nenhum .apk encontrado dentro do .zip enviado." >&2
              exit 1
            fi
            if [ "$APK_COUNT" -eq 1 ]; then
              echo "só havia 1 .apk lá dentro — a usar diretamente, sem fundir."
              SINGLE=$(find work/splits_in -maxdepth 2 -iname "*.apk" | head -n1)
              echo "APK_PATH=$SINGLE" >> "$GITHUB_ENV"
            else
              echo "a descarregar APKEditor para fundir os splits num .apk único..."
              APKEDITOR_URL=$(curl -s https://api.github.com/repos/REAndroid/APKEditor/releases/latest \
                | grep "browser_download_url.*\.jar" | head -n1 | cut -d '"' -f4)
              if [ -z "$APKEDITOR_URL" ]; then
                echo "✗ não consegui encontrar o .jar do APKEditor na última release." >&2
                exit 1
              fi
              curl -sL -o APKEditor.jar "$APKEDITOR_URL"
              java -jar APKEditor.jar m -i work/splits_in -o work/merged.apk
              echo "✓ splits fundidos em work/merged.apk, $(stat -c%s work/merged.apk) bytes"
              echo "APK_PATH=work/merged.apk" >> "$GITHUB_ENV"
            fi
          else
            echo "ficheiro enviado já é um .apk único — nada a fundir."
            echo "APK_PATH=$SRC" >> "$GITHUB_ENV"
          fi

      - name: Instalar apktool
        run: |
          # A mesma versão oficial (3.0.2, direto do GitHub) que o build-apk.yml
          # usa para reconstruir. TÊM de ser a mesma versão dos dois lados —
          # o "apktool.yml" gerado aqui é lido pelo apktool do lado do build, e
          # o formato desse ficheiro mudou entre versões (v2 vs v3). Também evita
          # o pacote antigo/com bug do Ubuntu ("apt-get install apktool").
          APKTOOL_VERSION="3.0.2"
          sudo curl -sL -o /usr/local/bin/apktool \
            https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          sudo curl -sL -o /usr/local/bin/apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Descompilar recursos + smali (apktool)
        run: |
          # corre sempre (mesmo que só se queira o java do jadx), porque é
          # também aqui que descobrimos o nome do pacote da app para filtrar
          # o ruído das bibliotecas do sistema mais à frente.
          apktool d "$APK_PATH" -o work/apktool_out -f
          mkdir -p work/final/manifest work/final/resources work/final/smali work/final/assets
          cp work/apktool_out/AndroidManifest.xml work/final/manifest/ 2>/dev/null || true
          [ "${{ github.event.inputs.want_resources }}" = "true" ] && cp -r work/apktool_out/res work/final/resources/ 2>/dev/null || true
          # os assets web (html/js/css do Capacitor) vêm sempre, independente
          # de want_resources — é o "código da app" propriamente dito, não
          # um "recurso" no sentido do checkbox de layouts/strings/imagens.
          cp -r work/apktool_out/assets/. work/final/assets/ 2>/dev/null || true
          [ "${{ github.event.inputs.want_smali }}" = "true" ] && cp -r work/apktool_out/smali* work/final/smali/ 2>/dev/null || true
          # remove a pasta assets se ficou vazia (apk sem conteúdo web embutido)
          rmdir work/final/assets 2>/dev/null || true

          # apktool.yml é METADADOS DE RECONSTRUÇÃO (versionCode/Name, tipo de
          # compressão, sdk mínimo/alvo, lista de ficheiros a não comprimir).
          # Sem isto, uma reconstrução posterior via "apktool b" tende a falhar
          # ou a gerar um .apk que não instala — por isso vai sempre incluído,
          # independente das opções smali/java/resources escolhidas.
          cp work/apktool_out/apktool.yml work/final/apktool.yml 2>/dev/null || true

          # "unknown/" guarda ficheiros do .apk original que o apktool não
          # reconhece (raro, mas existe em algumas apps) — incluído quando
          # presente, para a reconstrução ficar mais fiel ao original.
          [ -d work/apktool_out/unknown ] && cp -r work/apktool_out/unknown work/final/unknown || true

      - name: Detetar pacote da própria app
        id: pkg
        run: |
          PKG=$(grep -m1 -oP 'package="\K[^"]+' work/apktool_out/AndroidManifest.xml || true)
          if [ -z "$PKG" ]; then
            echo "não consegui detetar o pacote da app; app_only será ignorado nesta corrida." >&2
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "pacote detetado: $PKG"
            echo "path=$(echo "$PKG" | tr '.' '/')" >> "$GITHUB_OUTPUT"
          fi

      - name: Filtrar smali de bibliotecas de sistema (só o código da app)
        if: ${{ github.event.inputs.app_only == 'true' && steps.pkg.outputs.path != '' }}
        run: |
          PKGPATH="${{ steps.pkg.outputs.path }}"
          echo "smali: a manter só $PKGPATH em cada smali_classesN, a remover android/androidx/kotlin/com.google/etc."
          if [ -d work/final/smali ]; then
            for dir in work/final/smali/*/; do
              dir="${dir%/}"
              if [ -d "$dir/$PKGPATH" ]; then
                tmp=$(mktemp -d)
                mkdir -p "$tmp/$(dirname "$PKGPATH")"
                cp -r "$dir/$PKGPATH" "$tmp/$(dirname "$PKGPATH")/"
                rm -rf "$dir"
                mkdir -p "$dir"
                cp -r "$tmp/." "$dir/"
                rm -rf "$tmp"
              else
                rm -rf "$dir"
              fi
            done
          fi

      - name: Descarregar jadx
        if: ${{ github.event.inputs.want_java == 'true' }}
        run: |
          JADX_URL=$(curl -s https://api.github.com/repos/skylot/jadx/releases/latest \
            | grep "browser_download_url.*\.zip" | head -n1 | cut -d '"' -f4)
          if [ -z "$JADX_URL" ]; then
            echo "não consegui encontrar o zip do jadx na última release." >&2
            exit 1
          fi
          curl -L -o jadx.zip "$JADX_URL"
          unzip -q jadx.zip -d jadx_bin
          chmod +x jadx_bin/bin/jadx

      - name: Descompilar Java aproximado (jadx)
        if: ${{ github.event.inputs.want_java == 'true' }}
        run: |
          ./jadx_bin/bin/jadx -d work/jadx_out "$APK_PATH" || true
          mkdir -p work/final/java
          cp -r work/jadx_out/sources/* work/final/java/ 2>/dev/null || true

      - name: Filtrar java de bibliotecas de sistema (só o código da app)
        if: ${{ github.event.inputs.want_java == 'true' && github.event.inputs.app_only == 'true' && steps.pkg.outputs.path != '' }}
        run: |
          PKGPATH="${{ steps.pkg.outputs.path }}"
          echo "java: a manter só $PKGPATH, a remover android/androidx/kotlin/kotlinx/org/com.google/com.getcapacitor/etc."
          if [ -d "work/final/java/$PKGPATH" ]; then
            tmp=$(mktemp -d)
            mkdir -p "$tmp/$(dirname "$PKGPATH")"
            cp -r "work/final/java/$PKGPATH" "$tmp/$(dirname "$PKGPATH")/"
            rm -rf work/final/java
            mkdir -p work/final/java
            cp -r "$tmp/." work/final/java/
            rm -rf "$tmp"
          else
            echo "aviso: não encontrei $PKGPATH dentro do java decompilado; a manter tudo para não perder o código da app." >&2
          fi

      - name: Gerar árvore de ficheiros (para a UI)
        run: |
          cd work/final
          find . -type f | sed 's|^\./||' > ../../tree.txt

      - name: Compactar resultado
        run: |
          cd work/final
          zip -qr ../../${{ github.event.inputs.job_id }}.zip .

      - name: Publicar release com o resultado
        uses: softprops/action-gh-release@v2
        with:
          tag_name: decompile-${{ github.event.inputs.job_id }}
          files: |
            ${{ github.event.inputs.job_id }}.zip
            tree.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Remove o .apk temporário de incoming/ para o repositório não acumular
      # binários — corre sempre, mesmo que um passo anterior tenha falhado.
      - name: Limpar apk temporário do repositório
        if: always()
        run: |
          git config user.name "apk-unpack-bot"
          git config user.email "actions@github.com"
          if [ -f "${{ github.event.inputs.apk_path }}" ]; then
            git rm -f "${{ github.event.inputs.apk_path }}"
            git commit -m "apk-unpack: limpar ${{ github.event.inputs.apk_path }}"
            git push
          fi
